<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Job Crawler — search</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="/">
<style>
  :root{--bg:#f6f7f9;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#f97316;--accent-ink:#ea580c;--ok:#15803d;--bad:#dc2626;--chip:#f1f5f9}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1120;--panel:#111827;--ink:#e5e7eb;--muted:#94a3b8;--line:#1f2937;--chip:#1e293b}}
  *,::before,::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:18px 14px 40px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input[type=text],select{flex:1 1 220px;min-width:0;padding:12px 14px;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;outline:none}
  select{flex:0 0 130px;cursor:pointer}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.18)}
  button{padding:12px 20px;font-size:15px;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:10px;cursor:pointer}
  button:hover:not(:disabled){background:var(--accent-ink)}
  button:disabled{opacity:.6;cursor:progress}
  .hint{font-size:12.5px;color:var(--muted);margin:12px 0 0}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .bar h2{font-size:15px;margin:0}
  .status{font-size:13px;color:var(--muted)}
  .status.ok{color:var(--ok);font-weight:700}
  .status.bad{color:var(--bad);font-weight:700}
  .banner{display:none;border-radius:11px;padding:12px 14px;font-size:13.5px;font-weight:600;margin-bottom:14px}
  .banner.show{display:block}
  .banner.good{background:rgba(21,128,61,.12);color:var(--ok);border:1px solid rgba(21,128,61,.35)}
  .banner.bad{background:rgba(220,38,38,.1);color:var(--bad);border:1px solid rgba(220,38,38,.35)}
  .state{color:var(--muted);font-size:14.5px;padding:26px 4px;text-align:center}
  .state.bad{color:var(--bad)}
  .job{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--panel)}
  .job a.title{font-size:16.5px;font-weight:700;color:#0284c7;text-decoration:none;display:block}
  @media (prefers-color-scheme:dark){.job a.title{color:#7dd3fc}}
  .job a.title:hover{text-decoration:underline}
  .meta{font-size:13px;color:var(--muted);margin-top:7px}
  .meta strong{color:var(--ink)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:11.5px;font-weight:700;background:var(--chip);color:var(--muted);padding:4px 9px;border-radius:999px;text-transform:uppercase}
  .chip.pay{background:rgba(21,128,61,.12);color:var(--ok)}
  .snip{font-size:13.5px;color:var(--muted);margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .spin{width:15px;height:15px;border-radius:50%;display:inline-block;border:2px solid rgba(249,115,22,.3);border-top-color:var(--accent);animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  footer{text-align:center;font-size:12.5px;color:var(--muted);margin-top:20px}
  footer code{background:var(--chip);padding:2px 6px;border-radius:5px;font-size:11.5px}
  @media (max-width:520px){select,button{flex:1 1 100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner" id="banner" role="status" aria-live="polite"></div>

  <section class="panel">
    <label class="lbl" for="jobQuery">Search keyword or tech stack</label>
    <div class="row">
      <input type="text" id="jobQuery" placeholder="e.g. React, Rust, DevOps, Technical Writer" value="software engineer" autocomplete="off" spellcheck="false" maxlength="120">
      <select id="limitSelect" aria-label="Result count">
        <option value="10">10 results</option>
        <option value="15" selected>15 results</option>
        <option value="25">25 results</option>
        <option value="30">30 results</option>
      </select>
      <button id="crawlBtn" type="button">Crawl Jobs</button>
    </div>
    <p class="hint">Press <strong>Enter</strong> or click <strong>Crawl Jobs</strong>. Sources: Remotive, Arbeitnow.</p>
  </section>

  <section class="panel" id="resultsPanel">
    <div class="bar">
      <h2>Live Crawled Results</h2>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>
    <div id="results"><p class="state"><span class="spin"></span>Starting…</p></div>
    <noscript><p class="state bad">JavaScript is off. Query the API directly: <code>/api/crawl?q=react&amp;limit=15</code></p></noscript>
  </section>

  <footer>route <code>/api/crawl?q=</code> · same-origin, no keys · <a href="/">full page</a></footer>
</div>

<script>
(function () {
  'use strict';
  var input = document.getElementById('jobQuery');
  var limitSelect = document.getElementById('limitSelect');
  var button = document.getElementById('crawlBtn');
  var results = document.getElementById('results');
  var statusEl = document.getElementById('status');
  var busy = false;

  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function say(t, k) { statusEl.textContent = t || ''; statusEl.className = 'status' + (k ? ' ' + k : ''); }
  function setBusy(v) { busy = v; button.disabled = v; button.textContent = v ? 'Crawling…' : 'Crawl Jobs'; }
  function fail(m) { say('Failed', 'bad'); results.innerHTML = '<p class="state bad">Crawl failed: ' + esc(m) + '</p>'; }

  /* Tell the parent page what was searched so its URL stays shareable. */
  function tellParent(q) {
    if (window.parent === window) return;
    try { parent.postMessage({ type: 'query', q: q }, location.origin); } catch (e) {}
  }

  function renderJobs(list) {
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var j = list[i];
      html += '<article class="job"><a class="title" href="' + esc(j.url) + '" target="_blank" rel="noopener noreferrer">' + esc(j.title) + '</a>';
      html += '<div class="meta"><strong>' + esc(j.company) + '</strong> · ' + esc(j.location) + '</div>';
      var chips = '';
      if (j.jobType) chips += '<span class="chip">' + esc(String(j.jobType).replace(/_/g, ' ')) + '</span>';
      if (j.category) chips += '<span class="chip">' + esc(j.category) + '</span>';
      if (j.salary) chips += '<span class="chip pay">' + esc(j.salary) + '</span>';
      if (j.source) chips += '<span class="chip">' + esc(j.source) + '</span>';
      if (chips) html += '<div class="chips">' + chips + '</div>';
      if (j.snippet) html += '<p class="snip">' + esc(j.snippet) + '</p>';
      html += '</article>';
    }
    results.innerHTML = html;
  }

  async function crawl() {
    if (busy) return;
    var q = input.value.trim() || 'software engineer';
    var limit = limitSelect.value || '15';
    setBusy(true); say('');
    results.innerHTML = '<p class="state"><span class="spin"></span>Crawling live job boards…</p>';
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 20000);
    try {
      var res = await fetch('/api/crawl?q=' + encodeURIComponent(q) + '&limit=' + encodeURIComponent(limit),
        { signal: ctrl.signal, headers: { Accept: 'application/json' } });
      var ct = (res.headers.get('content-type') || '').toLowerCase();
      if (ct.indexOf('json') === -1) { fail('server returned ' + (ct || 'no content-type')); return; }
      var data = await res.json();
      if (!res.ok || !data.success) { fail(data.error || ('status ' + res.status)); return; }
      if (!data.jobs || !data.jobs.length) {
        say('0 matches', 'bad');
        results.innerHTML = '<p class="state">No live listings for <strong>' + esc(data.query || q) + '</strong>. Try a broader keyword.</p>';
        tellParent(q);
        return;
      }
      say(data.count + ' live listing' + (data.count === 1 ? '' : 's') + ' · ' + (data.source || ''), 'ok');
      renderJobs(data.jobs);
      tellParent(q);
      try {
        var u = new URL(location.href);
        u.searchParams.set('q', q);
        history.replaceState(null, '', u);
      } catch (e) {}
    } catch (e) {
      fail(e.name === 'AbortError' ? 'timed out after 20s' : (e.message || 'network error'));
    } finally { clearTimeout(timer); setBusy(false); }
  }

  button.addEventListener('click', crawl);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); crawl(); } });
  limitSelect.addEventListener('change', function () { if (results.querySelector('.job')) crawl(); });

  var preset = new URLSearchParams(location.search).get('q');
  if (preset) input.value = preset.replace(/-/g, ' ');
  crawl();
})();
</script>
</body>
</html>
